name: AI Code Review & Verification CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Forensic Verification & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Strict Typecheck
        run: npx tsc --noEmit

      - name: ESLint Code Quality
        run: npm run lint

      - name: Documentation & Link Integrity Check
        run: npm run test:docs

      - name: Forensic Data & Archival Consistency
        run: npm run test:data

      - name: Security & Secret Leak Audit
        run: npm run test:security

      - name: Production Build & Bundle Optimization
        run: npm run build:vercel

      - name: Full Automated Test Suite
        run: npm run test:all

      - name: High/Critical Dependency Audit
        run: npm audit --audit-level=high || true
