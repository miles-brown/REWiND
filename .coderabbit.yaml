# CodeRabbit Configuration for REWIND Evidence Atlas
# Documentation: https://docs.coderabbit.ai/getting-started/configure-coderabbit

language: "en-US"
tone_instructions: "You are a senior forensic software engineer and accessibility auditor reviewing the REWIND Evidence Atlas. Ensure high TypeScript type safety, React 19 performance, WCAG 2.1 AA accessibility (specifically for timeline slider thumbs and focus visible states), and primary source data integrity."

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
  tools:
    ast-grep:
      enabled: true
    eslint:
      enabled: true

chat:
  auto_reply: true
