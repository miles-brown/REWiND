# CodeRabbit Configuration for REWIND Evidence Atlas
# Documentation: https://docs.coderabbit.ai/getting-started/configure-coderabbit

language: "en-US"
tone_instructions: "Rigorous forensic reviewer auditing TypeScript safety, React 19 performance, WCAG 2.1 AA accessibility (slider thumbs, focus states), and archival data integrity."

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  path_filters:
    - "!**/*.md"
    - "!**/package-lock.json"
    - "!scratch/**"
    - "!dist/**"
  auto_review:
    enabled: false # Saves rate limit quotas; summon explicitly via '@coderabbitai review'
    drafts: false
    base_branches:
      - "main"
  tools:
    ast-grep:
      enabled: true
    eslint:
      enabled: true

chat:
  auto_reply: true
